<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Municipality Analytics - LarvaeLens</title><link rel="icon" type="image/png" href="images/icon.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>body{margin:0;background:#0d1117;color:#fff;font-family:Arial}.navbar{background:#161b22}.sidebar{width:250px;height:100vh;position:fixed;background:#161b22;padding:20px}.sidebar a{display:block;color:#fff;text-decoration:none;margin:20px 0}.sidebar a:hover{color:#00ffaa}.main-content{margin-left:270px;padding:30px}.card{background:#161b22;border:1px solid #30363d;border-radius:18px;color:#fff}.metric{font-size:28px;font-weight:700;color:#00ffaa}.chart-wrap{height:320px}.filter-btn{background:#161b22;color:#fff;border:1px solid #30363d;border-radius:8px;padding:8px 14px;margin-right:6px}.filter-btn.active,.filter-btn:hover{background:#00ffaa;color:#0d1117}.muted{color:#8b949e}</style></head><script>if(localStorage.getItem("adminLoggedIn")!=="true")window.location.href="municipality-login.html";</script><body><nav class="navbar navbar-dark px-4"><div class="container-fluid"><a class="navbar-brand" href="index.html"><img src="images/logo.png" alt="Larvae Lens" height="65"></a><button class="btn btn-outline-light" onclick="adminlogout()"><i class="bi bi-box-arrow-right"></i> Logout</button></div></nav><div class="sidebar"><a href="admindashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a><a href="municipality-analytics.html"><i class="bi bi-bar-chart-line"></i> Analytics</a><a href="admindashboard.html#reports"><i class="bi bi-file-earmark-text"></i> Reports</a><a href="admindashboard.html#priority-section"><i class="bi bi-exclamation-diamond"></i> Priority Cases</a></div><main class="main-content"><h1>Municipality Analytics</h1><p class="muted">Operational overview of mosquito breeding reports.</p><div class="mb-4 mt-4"><button class="filter-btn" onclick="setPeriod('TODAY',this)">Today</button><button class="filter-btn active" onclick="setPeriod('7D',this)">7 Days</button><button class="filter-btn" onclick="setPeriod('30D',this)">30 Days</button><button class="filter-btn" onclick="setPeriod('3M',this)">3 Months</button></div><div class="row g-3 mb-4"><div class="col-md-3"><div class="card p-3"><div class="muted">Total Cases</div><div id="totalCases" class="metric">0</div></div></div><div class="col-md-3"><div class="card p-3"><div class="muted">Critical / High</div><div id="priorityCases" class="metric">0</div></div></div><div class="col-md-3"><div class="card p-3"><div class="muted">Completed</div><div id="completedCases" class="metric">0</div></div></div><div class="col-md-3"><div class="card p-3"><div class="muted">Resolution Rate</div><div id="resolutionRate" class="metric">0%</div></div></div></div><div class="row g-4"><div class="col-lg-6"><div class="card p-3"><h5>Risk Distribution</h5><div class="chart-wrap"><canvas id="riskChart"></canvas></div></div></div><div class="col-lg-6"><div class="card p-3"><h5>Cases Over Time</h5><div class="chart-wrap"><canvas id="casesChart"></canvas></div></div></div><div class="col-lg-6"><div class="card p-3"><h5>Intervention Status</h5><div class="chart-wrap"><canvas id="statusChart"></canvas></div></div></div><div class="col-lg-6"><div class="card p-3"><h5>Habitat Reports</h5><div class="chart-wrap"><canvas id="habitatChart"></canvas></div></div></div></div></main><script type="module">import { ENV } from './js/config.js';window.adminlogout=function(){localStorage.removeItem('adminLoggedIn');window.location.href='municipality-login.html'};window.setPeriod=function(period,button){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));button.classList.add('active')};const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#fff'}}},scales:{x:{ticks:{color:'#fff'}},y:{beginAtZero:true,ticks:{color:'#fff'}}}};new Chart(document.getElementById('riskChart'),{type:'doughnut',data:{labels:['Critical','High','Medium','Low'],datasets:[{data:[87,241,532,424]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#fff'}}}}});new Chart(document.getElementById('casesChart'),{type:'line',data:{labels:['Aug 12','Aug 13','Aug 14','Aug 15','Aug 16','Aug 17','Aug 18','Aug 19'],datasets:[{label:'Total Cases',data:[34,41,52,68,81,96,113,127],tension:.35},{label:'Critical + High',data:[8,11,13,17,21,27,31,36],tension:.35}]},options:opts});new Chart(document.getElementById('statusChart'),{type:'bar',data:{labels:['Pending','In Progress','Completed'],datasets:[{label:'Cases',data:[126,231,927]}]},options:opts});new Chart(document.getElementById('habitatChart'),{type:'bar',data:{labels:['Open Stagnant Water','Breeding Objects','Vegetation','Other'],datasets:[{label:'Reports',data:[48,31,14,7]}]},options:opts});try{const r=await fetch(`${ENV.API_BASE_URL}/reports`);const reports=await r.json();const total=reports.length,critical=reports.filter(x=>['CRITICAL','HIGH'].includes(String(x.risk_level||'').toUpperCase())).length,completed=reports.filter(x=>String(x.status||'').toUpperCase()==='COMPLETED').length;document.getElementById('totalCases').textContent=total;document.getElementById('priorityCases').textContent=critical;document.getElementById('completedCases').textContent=completed;document.getElementById('resolutionRate').textContent=(total?(completed/total*100).toFixed(1):0)+'%'}catch(e){console.warn(e)}</script></body></html>
