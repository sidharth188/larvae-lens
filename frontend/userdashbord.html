 <table class="table table-dark table-hover mt-4">

<script type="module" src="js/app.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  window.watsonAssistantChatOptions = {
    integrationID: "5cdf7aee-f898-4bd9-a8fb-93cf08d294b5", // The ID of this integration.
    region: "https://integrations.au-syd.assistant.watson.appdomain.cloud", // The region your integration is hosted in.
    serviceInstanceID: "e30db63e-c7e5-43a7-9104-8ca30b3a58e2", // The ID of your service instance.
    onLoad: async (instance) => { await instance.render(); }
  };
  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { ENV } from './js/config.js';

  const app = initializeApp(ENV.FIREBASE_CONFIG);
  const auth = getAuth(app);

  // Set welcome message
  const userName = localStorage.getItem("userName");
  if (document.getElementById("welcomeUser")) {
      document.getElementById("welcomeUser").innerText = userName || "";
  }

  // Logout handler
  window.logout = function() {
    signOut(auth).then(() => {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("userName");
      localStorage.removeItem("userEmail");
      window.location.href = "index.html";
    }).catch((error) => {
      console.error("Logout Error:", error);
      localStorage.removeItem("isLoggedIn");
      window.location.href = "index.html";
    });
  };

  // Load user history
  async function loadUserHistory(){
      const email = localStorage.getItem("userEmail");
      if (!email) return;

      const response = await fetch(`${ENV.API_BASE_URL}/user-reports/${email}`);
      const reports = await response.json();
      const table = document.getElementById("historyTable");
      if (!table) return;

      table.innerHTML = "";
      reports.forEach((report, index) => {
          table.innerHTML += `
          <tr>
              <td>#LL10${index + 1}</td>
              <td>${report.risk_level}</td>
              <td>${report.status}</td>
              <td>${report.timestamp}</td>
          </tr>
          `;
      });
  }

  loadUserHistory();
</script>
</body>
