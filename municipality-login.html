<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Municipality Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{

            background:#0d1117;

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

            color:white;

            font-family:Arial;

        }

        .login-box{

            background:#161b22;

            padding:40px;

            border-radius:20px;

            width:400px;

        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#00ffaa;

        }

        .btn-custom{

            background:#00ffaa;

            width:100%;

            font-weight:bold;

        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>
            Municipality Login
        </h1>

        <input
        type="email"

        id="email"

        class="form-control mb-3"

        placeholder="Enter Email">

        <input
        type="password"

        id="password"

        class="form-control mb-3"

        placeholder="Enter Password">

        <button

        class="btn btn-custom"

        onclick="adminLogin()">

            Login

        </button>

    </div>

<script>

function adminLogin(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    if(

        email === "admin@larvaelens.com"

        &&

        password === "admin123"

    ){

        localStorage.setItem(

            "adminLoggedIn",

            "true"

        );

        window.location.href =
        "admindashboard.html";

    }

    else{

        alert("Invalid Admin Credentials");

    }

}

</script>

</body>
</html>
