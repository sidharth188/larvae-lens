<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Municipality Login</title>
    <link rel="icon"
type="image/png"
href="images/icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>



       body{
        min-height:100vh;
    background: linear-gradient(rgba(0,0,0,0.7),
    rgba(0,0,0,0.7)),
    url('images/hero.jpg');
        background-size: cover;
    background-position: center;

    color:white;

    font-family:Arial;

    margin:0;

}
        .login-box{

            background:rgba(22,27,34,0.92);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);

            padding:40px;

            border-radius:20px;

            width:400px;

        }

        h1{

            text-align:center;

            margin-bottom:30px;

            color:#00ffaa;

        }

        .btn-custom{

            background:#00ffaa;

            width:100%;

            font-weight:bold;

        }
        .custom-navbar{

    background:#161b22;

    padding:15px 30px;

}

.login-container{

    display:flex;

    justify-content:center;

    align-items:center;

    height:85vh;

}

    </style>

</head>

<body>
       <!-- Navbar -->
<nav class="navbar navbar-dark px-4 custom-navbar">


        <!-- Logo -->
        <a class="navbar-brand"
        href="index.html">

            <img
            src="images/logo.png"
            alt="Larvae Lens"
            height="65">

        </a>
        




</nav>

    <div class="login-container">

<div class="login-box">

        <h1>
            Municipality Login
        </h1>

        <input
        type="email"

        id="email"

        class="form-control mb-3"

        placeholder="Enter Email">

        <input
        type="password"

        id="password"

        class="form-control mb-3"

        placeholder="Enter Password">

        <button

        class="btn btn-custom"

        onclick="adminLogin()">

            Login

        </button>

    </div>
  
</div>

<script>

function adminLogin(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    if(

        email === "admin@larvaelens.com"

        &&

        password === "admin123"

    ){

        localStorage.setItem(

            "adminLoggedIn",

            "true"

        );

        window.location.href =
        "admindashboard.html";

    }

    else{

        alert("Invalid Admin Credentials");

    }

}

</script>

</body>
</html>
