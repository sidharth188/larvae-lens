<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Municipality Dashboard</title>
    <link rel="icon" type="image/png" href="images/icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

        body{
            background:#0d1117;
            color:white;
            font-family:Arial;
        }
        .admin-btn{

        background:linear-gradient(
        45deg,
        #00ffaa,
        #00bfff
    );

}

        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            background:#161b22;
            padding:20px;
        }

        .sidebar h2{
            color:#00ffaa;
            margin-bottom:40px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            margin:20px 0;
        }

        .main-content{
            margin-left:270px;
            padding:30px;
        }

        .dashboard-card{
            background:#161b22;
            border-radius:20px;
            padding:20px;
            margin-bottom:20px;
        }

        table{
            color:white !important;
        }

        .high{
            color:red;
            font-weight:bold;
        }

        .medium{
            color:orange;
            font-weight:bold;
        }

        .low{
            color:#00ffaa;
            font-weight:bold;
        }

    </style>
</head>
<script>

if(

    localStorage.getItem(

        "adminLoggedIn"

    ) !== "true"

){

    window.location.href =
    "municipality-login.html";

}

</script>
<body>
   <!-- Navbar -->
<nav class="navbar navbar-dark px-4 custom-navbar">

    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand"
        href="index.html">

            <img
            src="images/logo.png"
            alt="Larvae Lens"
            height="65">

        </a>
        <div class="d-flex align-items-center gap-2">
        
<button
class="btn nav-btn admin-btn"
onclick="adminlogout()">
 <i class="bi bi-box-arrow-right"></i>
    Logout

</button>
</div>

    </div>


</nav>

    <!-- Sidebar -->
    <div class="sidebar">


        <a href="#">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>
        <a href="#">
            <i class="bi bi-upload"></i>
            Upload Report
        </a>
        <a href="municipality-analytics.html">
            <i class="bi bi-bar-chart-line"></i>Analytics</a>
        <a href="#"
        onclick="adminlogout()">
         <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <div class="dashboard-card">

            <h1>
                Municipality Dashboard
            </h1>

            <p>
                Monitor mosquito breeding complaints.
            </p>

        </div>
        <!-- Map Section -->
        <div class="dashboard-card">

    <h3>
        Mosquito Risk Map
    </h3>

    <div id="map"
    style="height:500px;
    border-radius:20px;">
    </div>

</div>

        <!-- Reports Table -->
        <div class="dashboard-card">

            <h3>Reports</h3>

            <table class="table table-dark table-hover mt-4">

                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Risk</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="reportTable">

                </tbody>

            </table>

        </div>

    </div>
<script>

function adminlogout(){

    localStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
    "municipality-login.html";

}

</script>
<script src="js/app.js?v=20"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>
