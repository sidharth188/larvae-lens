</head>

<body>
   <!-- Navbar -->

        href="index.html">

            <img
            src="images/logo.png"
            alt="Larvae Lens"
            height="65">

        </a>
        <div class="d-flex align-items-center gap-2">
        <button
class="btn nav-btn admin-btn"
onclick="payNow()">

    Priority Municipal Report ₹20

</button>
<button
class="btn nav-btn admin-btn"
onclick="logout()">
 <i class="bi bi-box-arrow-right"></i>
    Logout

</button>
</div>

    </div>


</nav>

    <!-- Sidebar -->
    <div class="sidebar">

        <a href="#">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="#">
            <i class="bi bi-upload"></i>
            Upload Report
        </a>

        <a href="#">
            <i class="bi bi-clock-history"></i>
            Complaint Status
        </a>

        <a href="#">
            <i class="bi bi-credit-card"></i>
            Priority Report
        </a>

    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Welcome -->
        <div class="dashboard-card">

            <h1>
               Welcome
<span id="welcomeUser"></span>
👋
            </h1>

            <p>
                Monitor and report mosquito breeding hotspots in your area.
            </p>

        </div>

        <!-- Upload Section -->
        <div class="dashboard-card">

            <h3>
                Upload Mosquito Breeding Report

                style="font-size:60px;color:#00ffaa;"></i>

                <h4 class="mt-3">
                    Upload Stagnant Water Image
                </h4>

                <input type="file"
id="imageInput"
class="form-control mt-3">

                <button class="btn nav-btn admin-btn"
onclick="submitReport()">
    Submit Report
</button>



            </div>

        </div>

        <!-- Complaint History -->
        <div class="dashboard-card">

            <h3>
                Complaint History
            </h3>
 <table class="table table-dark table-hover mt-4">

        <thead>

            <tr>

                <th>ID</th>

                <th>Risk Level</th>

                <th>Status</th>

                <th>Time</th>

            </tr>

        </thead>

        <tbody id="historyTable">

        </tbody>

    </table>



        </div>

    </div>
<script src="js/app.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  window.watsonAssistantChatOptions = {
    integrationID: "5cdf7aee-f898-4bd9-a8fb-93cf08d294b5", // The ID of this integration.
    region: "https://integrations.au-syd.assistant.watson.appdomain.cloud", // The region your integration is hosted in.
    serviceInstanceID: "e30db63e-c7e5-43a7-9104-8ca30b3a58e2", // The ID of your service instance.
    onLoad: async (instance) => { await instance.render(); }
  };
  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>
<script>

function logout(){

    localStorage.clear();

    window.location.href =
    "index.html";

}

</script>
<script>

const userName =

localStorage.getItem(
    "userName"
);

document.getElementById(
    "welcomeUser"
).innerText = userName;

</script>
<script>

async function loadUserHistory(){

    const email =
    localStorage.getItem(
        "userEmail"
    );

    const response = await fetch(

        `
        https://larvae-lens-backend.onrender.com/user-reports/${email}
        `

    );

    const reports =
    await response.json();

    const table =
    document.getElementById(
        "historyTable"
    );

    table.innerHTML = "";

    reports.reverse().forEach((report,index)=>{

        table.innerHTML += `

        <tr>

            <td>
                #LL10${index + 1}
            </td>

            <td>
                ${report.risk_level}
            </td>

            <td>
                ${report.status}
            </td>

            <td>
                ${report.timestamp}
            </td>

        </tr>

        `;

    });

}

loadUserHistory();

</script>
</body>
</html>
